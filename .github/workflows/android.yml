
name: Build Automobile SoftBody Android ARM64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "$SDK_ROOT"
          sdkmanager --sdk_root="$SDK_ROOT" --install "ndk;28.1.13356709"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip scons
          scons --version

      - name: Build Android ARM64 Debug
        run: |
          scons -j2 platform=android arch=arm64 target=template_debug

      - name: Build Android ARM64 Release
        run: |
          scons -j2 platform=android arch=arm64 target=template_release

      - name: Verify libraries
        run: |
          ls -lh project/addons/mobile_softbody/bin/
          test -f project/addons/mobile_softbody/bin/libmobile_softbody.android.template_debug.arm64.so
          test -f project/addons/mobile_softbody/bin/libmobile_softbody.android.template_release.arm64.so

      - name: Upload Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: automobile-softbody-android-arm64
          path: project/addons/mobile_softbody/bin/*.so

